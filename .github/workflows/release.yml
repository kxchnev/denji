# Releasing is driven by the version in a package's manifest, not by a tag
# someone pushes: the manifest is the one place a version is written down, so a
# release cannot disagree with what was published. The tag is a consequence, and
# it is namespaced by the workspace it belongs to — `core@1.2.3`, `vscode@1.2.3`
# — because this repository ships two things on their own schedules.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Pushes to main are checked here and only here, so this runs for every
  # commit, not just the ones that publish.
  checks:
    uses: ./.github/workflows/ci.yml

  # The two `decide` jobs run on every push and are deliberately cheap — a
  # checkout and one query, no install. Everything expensive hangs off them.
  decide-core:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          name=$(node -p "require('./packages/core/package.json').name")
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The registry is the source of truth, not the diff. A rerun, a merge
          # that left the version alone and a re-pushed commit then all decide
          # the same way, where "did this file change" would answer differently
          # for each.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not in the registry — releasing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  decide-vscode:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          publisher=$(node -p "require('./packages/vscode/package.json').publisher")
          name=$(node -p "require('./packages/vscode/package.json').name")
          version=$(node -p "require('./packages/vscode/package.json').version")
          id="$publisher.$name"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The marketplace's own gallery API, asked directly. `vsce show` looks
          # like the tool for this and is not: for an extension that does not
          # exist it prints `undefined` and exits 0, so its exit code says
          # nothing — and installing it drags in azure-devops-node-api, cheerio
          # and secretlint for a job that runs on every push.
          resp=$(curl -sfS -X POST \
            https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json;api-version=3.0-preview.1' \
            -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$id\"}]}],\"flags\":1}"
          ) || { echo "could not reach the marketplace"; exit 1; }

          # A query that fails is an error, not a verdict — see the exit above.
          # Only a well-formed answer decides anything.
          #
          # The answer arrives on stdin rather than as an argument: it carries
          # every published version, so it grows with the extension, and Linux
          # caps a single argument at 128 KB. Measured at 386 KB for a
          # long-lived extension — this would have started failing years in.
          if printf '%s' "$resp" | node -e '
              const want = process.argv[1]
              let raw = ""
              process.stdin.on("data", (d) => (raw += d)).on("end", () => {
                let hit = false
                try {
                  const found = JSON.parse(raw).results[0].extensions
                  hit = found.length > 0 && found[0].versions.some((v) => v.version === want)
                } catch {}
                process.exit(hit ? 0 : 1)
              })
            ' "$version"; then
            echo "$id@$version is already on the marketplace — nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$id@$version is not on the marketplace — releasing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Each gate sits on the job it guards. It used to sit on a shared `checks`
  # job, which worked only as long as that one was conditional too — making it
  # unconditional silently left publishing with nothing stopping it.
  publish-core:
    needs: [decide-core, checks]
    if: needs.decide-core.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
      # Trusted publishing: the registry is handed a short-lived, signed
      # statement of which repo and which workflow file is asking, and checks it
      # against what the package was configured to trust. No token is stored
      # anywhere, so there is nothing here to leak or to rotate.
      id-token: write
    steps:
      # Full history: the notes are a commit range, and a shallow clone has
      # neither the earlier tag nor the commits between.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing landed in npm 11.5.1 and Node 22 still ships npm 10,
      # so the runner's npm is too old to do it.
      - run: npm install -g npm@latest

      - run: npm ci

      # No build step: the core's own prepublishOnly is clean + build + test,
      # so what ships is built from scratch by the same command that ships it.
      # No token either — the OIDC permission above is the credential.
      - name: Publish to npm
        run: npm publish -w packages/core

      - uses: ./.github/actions/tag-and-release
        with:
          prefix: core
          version: ${{ needs.decide-core.outputs.version }}
          paths: packages/core
          token: ${{ github.token }}

  publish-vscode:
    needs: [decide-vscode, checks]
    if: needs.decide-vscode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The whole build, not just the extension's: esbuild bundles
      # `@kxchnev/denji` through the workspace symlink, and packages/core/dist
      # does not exist yet after a clean install.
      - run: npm run build

      - run: npm run vscode:package

      # `--packagePath`, not a second build: the file on the release and the
      # file on the marketplace are then the same file, not two that look alike.
      #
      # VSCE_PAT is the one secret this repository has — npm publishes over OIDC
      # and needs none. It must be organization-scoped: Azure DevOps blocked new
      # global PATs in March 2026 and retires the rest on 1 December, so an
      # expiring token here is not a maintenance chore but a deadline.
      - name: Publish to the marketplace
        run: npx vsce publish --packagePath packages/vscode/denji.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - uses: ./.github/actions/tag-and-release
        with:
          prefix: vscode
          version: ${{ needs.decide-vscode.outputs.version }}
          # The .vsix carries the whole engine in dist/webview.js, so a change
          # to the layout changes this artifact and belongs in its notes.
          paths: packages/vscode packages/core
          asset: packages/vscode/denji.vsix
          token: ${{ github.token }}
